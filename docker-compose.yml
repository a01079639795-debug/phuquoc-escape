# Локальная инфраструктура разработки.
# В проде не используется: там управляемый Postgres и Cloudflare R2.
services:
  postgres:
    image: postgres:16-alpine
    container_name: phuquoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phuquoc
      POSTGRES_PASSWORD: phuquoc
      POSTGRES_DB: phuquoc
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phuquoc -d phuquoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
